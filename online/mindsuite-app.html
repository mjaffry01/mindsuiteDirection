<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MindSuite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F8;--surface:#FFFFFF;--ink:#18213A;--muted:#566079;--line:#DCE0E8;--accent:#E3A01B;--accent-ink:#7A5200;--done:#2E7D6B;--done-ink:#1F5E50;--empty:#E4E8EF;--partial:#F1C463;--focus:#2C5BD6;--warn:#B3261E;--warn-bg:#FCEBEA;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1322;--surface:#161C30;--ink:#E7EAF2;--muted:#9AA3BA;--line:#28314C;--accent:#F0B23A;--accent-ink:#F3C266;--done:#45A88F;--done-ink:#7FD1BC;--empty:#222A43;--partial:#A87A22;--focus:#7FA2FF;--warn:#F2B8B5;--warn-bg:#3A1F24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1322;--surface:#161C30;--ink:#E7EAF2;--muted:#9AA3BA;--line:#28314C;--accent:#F0B23A;--accent-ink:#F3C266;--done:#45A88F;--done-ink:#7FD1BC;--empty:#222A43;--partial:#A87A22;--focus:#7FA2FF;--warn:#F2B8B5;--warn-bg:#3A1F24;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.55}
#plan-root .wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
#plan-root h1,#plan-root h2,#plan-root h3{font-family:"Bricolage Grotesque",Manrope,system-ui,sans-serif;margin:0;letter-spacing:-0.01em}
#plan-root h1{font-size:clamp(30px,5vw,52px);line-height:1.02;font-weight:700;max-width:14ch}
#plan-root h2{font-size:22px;font-weight:700}
#plan-root h3{font-size:16px;font-weight:700}
#plan-root .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:28px}
#plan-root .sub{color:var(--muted);margin:10px 0 0;max-width:52ch}
#plan-root .stats{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
#plan-root .stat b{display:block;font-family:"Bricolage Grotesque",Manrope,sans-serif;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
#plan-root .stat span{font-size:13px;color:var(--muted)}
#plan-root label.start{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
#plan-root input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
#plan-root .year{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;overflow-x:auto}
#plan-root .qs{display:flex;gap:16px;min-width:max-content}
#plan-root .qb h3{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;font-family:Manrope,sans-serif;letter-spacing:0}
#plan-root .qb h3 strong{color:var(--ink);font-weight:700}
#plan-root .grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;gap:3px}
#plan-root .cell{width:13px;height:13px;border-radius:3px;border:0;padding:0;background:var(--empty);cursor:pointer}
#plan-root .cell.p{background:var(--partial)}
#plan-root .cell.f{background:var(--done)}
#plan-root .cell.sel{box-shadow:0 0 0 1.5px var(--ink)}
#plan-root .cell.today{outline:2px solid var(--accent);outline-offset:1px}
#plan-root .legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted);margin-top:12px}
#plan-root .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:6px}
#plan-root .quarters{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0 34px}
#plan-root .qc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
#plan-root .qc.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
#plan-root .qc p{margin:6px 0 0;font-size:14px;color:var(--muted)}
#plan-root .qc .qn{font-size:13px;color:var(--accent-ink);font-weight:700}
#plan-root .weekhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
#plan-root .weekhead .dates{color:var(--muted);font-size:15px;margin-left:10px;font-family:Manrope,sans-serif;font-weight:500}
#plan-root .btns{display:flex;gap:8px;flex-wrap:wrap}
#plan-root button.b{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
#plan-root button.b:hover{border-color:var(--muted)}
#plan-root button:focus-visible,#plan-root input:focus-visible,#plan-root .cell:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#plan-root .cols{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start;margin-top:24px}
@media (max-width:820px){#plan-root .cols{grid-template-columns:minmax(0,1fr)}}
#plan-root .side{display:flex;flex-direction:column;gap:12px}
#plan-root .panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
#plan-root .panel h3{margin-bottom:8px}
#plan-root .kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
#plan-root .kv dt{color:var(--muted)}
#plan-root .kv dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
#plan-root .panel ul{margin:0;padding-left:18px;font-size:14px}
#plan-root .panel li{margin:3px 0}
#plan-root .chips{display:flex;flex-wrap:wrap;gap:6px}
#plan-root .chip{font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
#plan-root .chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#plan-root .days{display:flex;flex-direction:column;gap:10px}
#plan-root .day{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:96px minmax(0,1fr);overflow:hidden}
#plan-root .day.istoday{border-color:var(--accent)}
#plan-root .day.rest{opacity:.85}
#plan-root .dnum{padding:14px 12px;border-right:1px solid var(--line)}
#plan-root .dnum b{display:block;font-family:"Bricolage Grotesque",Manrope,sans-serif;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
#plan-root .dnum span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
#plan-root .dnum em{display:inline-block;margin-top:6px;font-style:normal;font-size:12px;font-weight:700;color:var(--accent-ink)}
#plan-root .tasks{list-style:none;margin:0;padding:8px 14px}
#plan-root .tasks li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
#plan-root .tasks li:last-child{border-bottom:0}
#plan-root .tasks input{margin-top:4px;width:17px;height:17px;accent-color:var(--done);flex:none}
#plan-root .tasks label{flex:1;cursor:pointer}
#plan-root .tasks li.done label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
#plan-root .own{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;white-space:nowrap;margin-top:2px}
#plan-root .status{font-size:12px;color:var(--muted);min-height:18px;margin-top:6px}
#plan-root .none{color:var(--muted);font-size:14px;padding:12px 14px}
#plan-root .depgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:20px}
#plan-root .depbtn{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
#plan-root .depbtn b{font-size:14px}
#plan-root .depbtn span{font-size:12px;color:var(--muted)}
#plan-root .depbtn[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#plan-root .bar{height:6px;border-radius:3px;background:var(--empty);overflow:hidden}
#plan-root .bar span{display:block;height:100%;background:var(--done)}
#plan-root .tasks small{display:block;color:var(--muted);font-size:12px;text-decoration:none}
#plan-root .day.one{grid-template-columns:minmax(0,1fr)}
#plan-root .kv dd.warn{color:#B3261E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kv dd.warn{color:#F2B8B5}}
:root[data-theme="dark"] .kv dd.warn{color:#F2B8B5}
#plan-root .dephead h2{margin-bottom:2px}
#plan-root .dephead .sub{margin:4px 0 12px;font-size:14px}
#plan-root .stag{font-size:12px;font-weight:700;color:var(--accent-ink);border:1px solid var(--accent);border-radius:6px;padding:0 6px;white-space:nowrap;margin-top:2px}
#plan-root .kv .sk{color:var(--accent-ink)}
#plan-root .qc p.sp,#plan-root .qnote p.sp{color:var(--accent-ink)}
#plan-root .mhead{margin:22px 0 2px;padding-top:12px;border-top:2px solid var(--ink)}
#plan-root .mhead h3{font-size:19px}
#plan-root .mhead p,#plan-root .qnote p{margin:4px 0 0;color:var(--muted);font-size:14px}
#plan-root .qnote{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:14px 16px;margin-top:10px}
@media (min-width:821px){#plan-root .cols.all .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}}
@media (max-width:520px){#plan-root .day{grid-template-columns:minmax(0,1fr)}
#plan-root .dnum{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
#plan-root .dnum span,#plan-root .dnum em{margin-top:0}}
#plan-root .ctrl{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
#plan-root .ctrlrow{display:flex;gap:12px;align-items:flex-start}
#plan-root .lbl{font-size:13px;color:var(--muted);min-width:52px;padding-top:4px}
#plan-root .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
#plan-root .seg button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--ink);padding:5px 14px;cursor:pointer}
#plan-root .seg button+button{border-left:1px solid var(--line)}
#plan-root .seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
#plan-root .yhead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
#plan-root .yhead h2{font-size:19px}
#plan-root .yhead .dates{color:var(--muted);font-size:14px}
#plan-root .cell.z{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
#plan-root .cell.z.sel{box-shadow:0 0 0 1.5px var(--ink)}
#plan-root .legend i.zl{box-shadow:inset 0 0 0 1px var(--line);background:transparent}
#plan-root .deplist{display:flex;flex-direction:column;gap:2px}
#plan-root .deprow{font:inherit;text-align:left;background:transparent;border:0;border-radius:8px;padding:6px 6px;color:var(--ink);cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline}
#plan-root .deprow:hover{background:var(--bg)}
#plan-root .deprow .dn{font-size:14px;font-weight:600}
#plan-root .deprow .dc{font-size:12px;color:var(--muted);text-align:right}
#plan-root .deprow .bar{grid-column:1/-1}
#plan-root button.dnum{font:inherit;color:inherit;background:transparent;border:0;border-right:1px solid var(--line);text-align:left;cursor:pointer}
#plan-root button.dnum:hover b{text-decoration:underline}
#plan-root .day.overdue{border-color:#C24A3B}
#plan-root .day.overdue .dnum b{color:#B3261E}
#plan-root .tasks li.more{color:var(--muted);font-size:13px}
#plan-root .listh{margin:18px 0 0}
#plan-root .calwrap{overflow-x:auto}
#plan-root .cal{display:grid;grid-template-columns:repeat(7,minmax(84px,1fr));gap:4px;min-width:600px}
#plan-root .calh{font-size:12px;color:var(--muted);padding:0 4px}
#plan-root .calc{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;min-height:104px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
#plan-root .calc.out{background:transparent;border-style:dashed;cursor:default;color:var(--muted)}
#plan-root .calc.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
#plan-root .calc.full{border-color:var(--done)}
#plan-root .calc .cd{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:4px}
#plan-root .calc .cd small{font-weight:500;font-size:11px;color:var(--muted)}
#plan-root .calc .cc{font-size:12px;color:var(--muted)}
#plan-root .sn{list-style:none;margin:2px 0 0;padding:0;font-size:12px;line-height:1.35}
#plan-root .sn li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#plan-root .sn li.done{color:var(--muted);text-decoration:line-through}
#plan-root .sn li.more{color:var(--muted)}
@media (max-width:640px){#plan-root .cal{min-width:0;grid-template-columns:repeat(7,minmax(0,1fr))}
#plan-root .calc{min-height:58px;padding:4px}
#plan-root .sn,#plan-root .calc .cd small{display:none}
#plan-root .calc .cc{font-size:11px}
#plan-root .ctrlrow{flex-direction:column;gap:4px}}
#plan-root .kitlink{display:inline-block;margin-top:10px;font-size:14px;font-weight:600;color:var(--ink)}
#plan-root .kv dd.good{color:var(--done-ink)}
#plan-root .warnline{color:#B3261E}
#kit-root .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
#kit-root h1,#kit-root h2,#kit-root h3{font-family:"Bricolage Grotesque",Manrope,system-ui,sans-serif;margin:0;letter-spacing:-0.01em}
#kit-root h1{font-size:clamp(28px,4.4vw,44px);line-height:1.05;font-weight:700}
#kit-root h2{font-size:21px;font-weight:700}
#kit-root h3{font-size:16px;font-weight:700}
#kit-root .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}
#kit-root .sub{color:var(--muted);margin:8px 0 0;max-width:60ch}
#kit-root .clock{text-align:right}
#kit-root .clock b{display:block;font-family:"Bricolage Grotesque",Manrope,sans-serif;font-size:26px;line-height:1}
#kit-root .clock span{font-size:13px;color:var(--muted)}
#kit-root .tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px}
#kit-root .tabs button{font:inherit;font-size:15px;font-weight:600;color:var(--muted);background:transparent;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;margin-bottom:-1px}
#kit-root .tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
#kit-root .notice{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
#kit-root .goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:22px}
#kit-root .goal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
#kit-root .goal .gl{font-size:13px;color:var(--muted);font-weight:600}
#kit-root .goal .gv{font-family:"Bricolage Grotesque",Manrope,sans-serif;font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#kit-root .goal .gt{font-size:13px;color:var(--muted)}
#kit-root .goal.ok{border-color:var(--done)}
#kit-root .goal.ok .gv{color:var(--done-ink)}
#kit-root .goal.bad .gv{color:var(--warn)}
#kit-root .bar{height:7px;border-radius:4px;background:var(--empty);overflow:hidden}
#kit-root .bar span{display:block;height:100%;background:var(--done)}
#kit-root .bar.amber span{background:var(--accent)}
#kit-root .grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){#kit-root .grid2{grid-template-columns:minmax(0,1fr)}}
#kit-root .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
#kit-root .panel h3{margin-bottom:10px}
#kit-root .scroll{overflow-x:auto}
#kit-root table{border-collapse:collapse;width:100%;font-size:14px}
#kit-root th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
#kit-root td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
#kit-root td.n,#kit-root th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#kit-root tr:last-child td{border-bottom:0}
#kit-root .muted{color:var(--muted)}
#kit-root .warn{color:var(--warn)}
#kit-root .good{color:var(--done-ink)}
#kit-root .pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;border:1px solid var(--line);white-space:nowrap}
#kit-root .pill.warn{border-color:var(--warn);background:var(--warn-bg)}
#kit-root .pill.good{border-color:var(--done)}
#kit-root .att{list-style:none;margin:0;padding:0}
#kit-root .att li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:14px}
#kit-root .att li:last-child{border-bottom:0}
#kit-root .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
#kit-root button.b,#kit-root button.p{font:inherit;font-size:14px;border-radius:8px;padding:6px 12px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
#kit-root button.p{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
#kit-root button.link{font:inherit;font-size:13px;background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;padding:0}
#kit-root button:focus-visible,#kit-root input:focus-visible,#kit-root select:focus-visible,#kit-root textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#kit-root select,#kit-root input[type=text],#kit-root input[type=number],#kit-root input[type=date],#kit-root input[type=month],#kit-root textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%}
#kit-root select.sm{width:auto;padding:3px 6px;font-size:13px}
#kit-root .form{background:var(--surface);border:1px solid var(--ink);border-radius:14px;padding:16px 18px;margin-bottom:18px}
#kit-root .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 14px;margin:10px 0 14px}
#kit-root .fgrid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
#kit-root .fgrid label.wide{grid-column:1/-1}
#kit-root .fgrid label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
#kit-root .err{color:var(--warn);font-size:13px;min-height:18px}
#kit-root .formbtns{display:flex;gap:8px;flex-wrap:wrap}
#kit-root .board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
#kit-root .col{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
#kit-root .col h3{font-size:14px;display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
#kit-root .col h3 span{color:var(--muted);font-weight:600;font-family:Manrope,sans-serif;font-size:13px}
#kit-root .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:14px}
#kit-root .card b{display:block}
#kit-root .card .meta{font-size:12px;color:var(--muted)}
#kit-root .card .next{font-size:13px;margin-top:6px}
#kit-root .card .acts{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px}
#kit-root .closed{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}
#kit-root .empty{color:var(--muted);font-size:14px;padding:6px 2px}
#kit-root .steps{margin:0;padding-left:20px;font-size:14px}
#kit-root .steps li{margin:4px 0}
#kit-root .chips{display:flex;gap:6px;flex-wrap:wrap}
